{% extends 'base.html' %}

{% block content %}
<div class="product-image-container">
    <div class="images">
        <img src="{{ url_for('static', filename='images/background.jpeg') }}" class="bg">
        <img src="{{ url_for('static', filename='images/' ~ product.image_url) }}" alt="{{product.name}}" class="fg">
    </div>
  <h1>{{product.name}}</h1>
</div>
<!-- section for product description and product size selection buttons -->
<section class="product-information">
    <div class="product-description">
    <p>{{product.description}}</p>
    </div>
    <div class="product-sizes-and-price">

<ul>
  {% for sp in sizes_with_prices %}
    <li>
       <button onclick="selectSize('{{ sp.size.name }}', '{{ sp.price }}')">
        <img src="{{ url_for('static', filename='logos/coffee-cup.webp') }}" 
             alt="{{ sp.size.name }}-cup"
             height="{{ 60 + loop.index0*10 }}px"
             width="{{ 60 + loop.index0*10 }}px">
        <span>${{ sp.price }}</span>
      </button>
    </li>
  {% endfor %}
</ul>
</div>
</section>
<!-- section for related products to the selected products -->
 <section class="related-products">
    <h2>Related Products</h2>
    <div class="related-product-card">
        {% for product in related_products %}
         <a href="{{ url_for('selected_product', id=product.id) }}">
        <div class="related-card-items">
            <div class="related-img-container">
                <img src="{{ url_for('static', filename='images/' ~ product.image_url) }}" alt="{{ category }}">
            </div>
            <div class="related-card-item-info">
                <p>{{ product.name }}</p>
            </div>
        </div>
    </a>
    {% endfor %}
    </div>
 </section>
 <script>
document.querySelectorAll('.product-sizes-and-price button').forEach(function(btn, idx) {
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    // Determine size based on button index
    const sizes = ['small', 'medium', 'large'];
    const size = sizes[idx];
    // Get product info from template variables
    const productId = "{{ product.id }}";
    const productName = "{{ product.name }}";
    const productImg = "{{ product.img }}";
    // Prepare data
    const data = new URLSearchParams();
    data.append('product_id', productId);
    data.append('product_name', productName);
    data.append('product_img', productImg);
    data.append('size', size);
    // Send AJAX POST to /cart
    fetch("{{ url_for('cart') }}", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: data.toString()
    })
    .then(response => {
      if (response.redirected) {
        window.location.href = response.url; // Redirect to cart
      } else {
        alert("Added to cart!");
      }
    })
    .catch(() => alert("Error adding to cart"));
  });
});
</script>
{% endblock %}
